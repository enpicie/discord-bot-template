# Template-only: validates what the generator page hands out. Never shipped in
# a generated bot, never deploys — it builds each starter zip exactly the way
# the page does, unzips it, and runs that bot's own checks.
name: Template CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine and site build tests
        run: python -m unittest tests.test_generator -v

  generated-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every combination key from generator/engine.py combination_key.
        bundle:
          - 'bot_token+deferred_worker+dynamodb'
          - 'bot_token+deferred_worker'
          - 'bot_token+dynamodb'
          - 'deferred_worker+dynamodb'
          - 'bot_token'
          - 'deferred_worker'
          - 'dynamodb'
          - 'base'
    name: generated-bot (${{ matrix.bundle }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: hashicorp/setup-terraform@v3

      - name: Build site and the starter zip the page would hand out
        run: |
          python generator/build_site.py --out "$RUNNER_TEMP/site"
          node site/test/make_zip.mjs "$RUNNER_TEMP/site" '${{ matrix.bundle }}' ci-test-bot "$RUNNER_TEMP/ci-test-bot.zip"
          unzip -q "$RUNNER_TEMP/ci-test-bot.zip" -d "$RUNNER_TEMP"

      - name: Tests
        working-directory: ${{ runner.temp }}/ci-test-bot
        run: make test

      - name: Lint
        working-directory: ${{ runner.temp }}/ci-test-bot
        run: make lint

      - name: Terraform validate
        working-directory: ${{ runner.temp }}/ci-test-bot/terraform/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
