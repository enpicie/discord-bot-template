name: Release Pipeline

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
      force_rebuild_layer:
        description: 'Force rebuild of all Lambda layers even if requirements.txt is unchanged'
        required: false
        default: false
        type: boolean

jobs:
  read-config:
    # Bot pipelines never run in the template repo; the generator strips this.  # [template-only]
    if: ${{ github.repository != 'enpicie/discord-bot-template' }}  # [template-only]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      APP_NAME: ${{ steps.set-vars.outputs.APP_NAME }}
      AWS_REGION: ${{ steps.set-vars.outputs.AWS_REGION }}
      ARTIFACT_S3_BUCKET_PROD: ${{ steps.set-vars.outputs.ARTIFACT_S3_BUCKET_PROD }}
      PYTHON_RUNTIME: ${{ steps.set-vars.outputs.PYTHON_RUNTIME }}
      LAMBDA_ARCHITECTURE: ${{ steps.set-vars.outputs.LAMBDA_ARCHITECTURE }}
      DISCORD_PUBLIC_KEY: ${{ steps.set-vars.outputs.DISCORD_PUBLIC_KEY }}
      APP_VERSION: ${{ steps.set-vars.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v5
      - name: Load config and extract tag version
        id: set-vars
        run: |
          set -a
          source ./config.env
          set +a

          # github.ref_name is the tag name on a tag push; fall back to the
          # manual input when triggered via workflow_dispatch.
          APP_VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ "${{ github.ref_name }}" =~ $APP_VERSION_PATTERN ]]; then
            APP_VERSION="${{ github.ref_name }}"
          else
            APP_VERSION="${{ github.event.inputs.version }}"
          fi

          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "ARTIFACT_S3_BUCKET_PROD=$ARTIFACT_S3_BUCKET_PROD" >> $GITHUB_OUTPUT
          echo "PYTHON_RUNTIME=$PYTHON_RUNTIME" >> $GITHUB_OUTPUT
          echo "LAMBDA_ARCHITECTURE=$LAMBDA_ARCHITECTURE" >> $GITHUB_OUTPUT
          echo "DISCORD_PUBLIC_KEY=$DISCORD_PUBLIC_KEY_PROD" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

  unit-test:
    needs:
      - read-config
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-run-unit-tests.yml
    with:
      python_runtime: ${{ needs.read-config.outputs.PYTHON_RUNTIME }}

  deploy:
    needs:
      - read-config
      - unit-test
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/workflow-deploy.yml
    with:
      app_name: ${{ needs.read-config.outputs.APP_NAME }}
      aws_region: ${{ needs.read-config.outputs.AWS_REGION }}
      python_runtime: ${{ needs.read-config.outputs.PYTHON_RUNTIME }}
      lambda_architecture: ${{ needs.read-config.outputs.LAMBDA_ARCHITECTURE }}
      app_version: ${{ needs.read-config.outputs.APP_VERSION }}
      discord_public_key: ${{ needs.read-config.outputs.DISCORD_PUBLIC_KEY }}
      deployment_env: 'prod'
      artifact_s3_bucket: ${{ needs.read-config.outputs.ARTIFACT_S3_BUCKET_PROD }}
      force_rebuild_layer: ${{ github.event.inputs.force_rebuild_layer == 'true' }}
    secrets:
      AWS_ROLE_ARN_LAMBDA_APIGW_DDB_SQS: ${{ secrets.AWS_ROLE_ARN_LAMBDA_APIGW_DDB_SQS }}
      AWS_ROLE_ARN_S3: ${{ secrets.AWS_ROLE_ARN_S3 }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN_PROD }}  # [feature:bot_token]

  register-commands:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-register-commands.yml
    with:
      environment: 'prod'
      command_name: 'all'
    secrets:
      DISCORD_BOT_TOKEN_DEV: ${{ secrets.DISCORD_BOT_TOKEN_DEV }}
      DISCORD_BOT_TOKEN_PROD: ${{ secrets.DISCORD_BOT_TOKEN_PROD }}
